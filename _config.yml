# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Steff Horemans"
email: "steffhoremans3@gmail.com"
description: "I build the data infrastructure that lets AI put capability in the hands of scientists and engineers."
github_username: steff-ml
minimal_mistakes_skin: default
search: true
url: "https://steff-ml.github.io"   # no trailing slash
baseurl: ""


# Build settings
markdown: kramdown
theme: minimal-mistakes-jekyll
# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - ideas/
  - _archive/
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

author:
  name   : "Steff Horemans"
  avatar : "/assets/images/Steff_picture.jpg"
  bio    : "Data engineer with PhD in Life Sciences specializing in industrial and life science processes."
  location: "Antwerp, Belgium"
  links:
    - label: "Github"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/steff-ml"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/steff-horemans-34884497/"


footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/steff-ml"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/steff-horemans-34884497/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _products
  - scope:
      path: ""
      type: products
    values:
      layout: product
      author_profile: true
      share: true
      read_time: false
  # _concepts
  - scope:
      path: ""
      type: concepts
    values:
      layout: concept
      author_profile: true
      read_time: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

collections:
  products:
    output: true
    permalink: /products/:name/
  concepts:
    output: true
    permalink: /concepts/:name/