# The 3 lanes regular blog posts are written under (shown as a small pill
# on each post via _layouts/single.html). `slug` must match the
# `categories:` value in a post's front matter.
- slug: thinking
  title: "Thinking"
  description: "General essays and opinions, not tied to a specific project: how I approach the work, what I believe about it, and why."
- slug: engineering
  title: "Engineering"
  description: "Hardcore technical write-ups for fellow data engineers: modelling, pipelines, tests, lineage, and the trade-offs behind each."
- slug: products
  title: "Products"
  description: "What is broken, who it hurts, what the data actually looks like, and what I chose, learned or would do differently, for a specific project. Includes short concept/system explainers for a project's domain."
